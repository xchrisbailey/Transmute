included:
  - Apps
  - Packages
excluded:
  - "**/.build"
  - build

# swift-format owns layout; SwiftLint checks the rest.
disabled_rules:
  - trailing_comma
  - opening_brace
  - line_length

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - fatal_error_message
  - sorted_imports

identifier_name:
  excluded: [id, x, y, kg, lb, cm, m, s, to, at, by]

nesting:
  type_level: 2

custom_rules:
  use_make_test_container:
    name: "Use makeTestContainer()"
    regex: 'makeContainer\(\s*\.inMemory\s*\)'
    included: 'Packages/[^/]+/Tests/.*\.swift'
    message: "use makeTestContainer() from TransmuteTestSupport: it turns autosave off, whose timer traps when a container is released on another thread"
    severity: error
