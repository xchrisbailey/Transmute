name: Transmute
options:
  bundleIdPrefix: computer.srcery.transmute
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Transmute
    PRODUCT_NAME: Transmute
    # Plain HTTPS only, so TestFlight and App Store uploads skip the export compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_TESTABILITY: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: 0
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES

packages:
  TransmuteCore:
    path: Packages/TransmuteCore
  TransmuteIntelligence:
    path: Packages/TransmuteIntelligence
  TransmuteUI:
    path: Packages/TransmuteUI

targets:
  TransmuteiOS:
    type: application
    platform: iOS
    sources:
      - Apps/TransmuteiOS
      - Apps/IntentsShared
      - Apps/Shared
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteIntelligence
      - package: TransmuteUI
      - package: TransmuteUI
        product: TransmutePlanUI
      - package: TransmuteUI
        product: TransmuteLogUI
      - package: TransmuteUI
        product: TransmuteSettingsUI
      - target: TransmuteWatch
      - target: TransmuteWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/TransmuteiOS/TransmuteiOS.entitlements
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Localized by Apps/TransmuteiOS/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Transmute reads heart rate and bodyweight from Health to adjust your plan.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Transmute saves your workouts to Health.
    info:
      path: Apps/TransmuteiOS/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        # transmute://today and transmute://today/begin, from the widgets (#19).
        CFBundleURLTypes:
          - CFBundleURLName: computer.srcery.transmute
            CFBundleURLSchemes: [transmute]
        UILaunchScreen:
          UIColorName: BrandBase
        UIAppFonts: [Geist-Regular.otf, Geist-Medium.otf, Geist-SemiBold.otf, Geist-Bold.otf, Geist-ExtraBold.otf, GeistMono-Regular.otf, GeistMono-Medium.otf, GeistMono-SemiBold.otf, GeistMono-Bold.otf]

  # The Live Activity (#11), Today on the Home Screen and Lock Screen, and the Control Center
  # button (#19). The control's intent is the app's, compiled here too so the button can name it.
  TransmuteWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Apps/TransmuteWidgets
      - Apps/WidgetsShared
      - path: Apps/IntentsShared/BeginWorkoutIntent.swift
      - path: Apps/Shared/Localizable.xcstrings
      - path: Apps/Shared/Assets.xcassets
      - path: Resources/Fonts/GeistMono-SemiBold.otf
        buildPhase: resources
      - path: Resources/Fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute.widgets
        PRODUCT_NAME: TransmuteWidgets
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        CODE_SIGN_ENTITLEMENTS: Apps/TransmuteWidgets/TransmuteWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
    info:
      path: Apps/TransmuteWidgets/Info.plist
      properties:
        CFBundleDisplayName: Transmute
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [GeistMono-SemiBold.otf]

  TransmuteWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/TransmuteWatch
      # The three shortcuts (#19). Spotlight and App Entities are the iPhone's and the Mac's.
      - path: Apps/IntentsShared
        excludes: [Spotlight]
      - Apps/Shared
      - path: Resources/Fonts/GeistMono-SemiBold.otf
        buildPhase: resources
      - path: Resources/Fonts/GeistMono-Bold.otf
        buildPhase: resources
      - path: Resources/Fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteUI
      - target: TransmuteWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute.watchkitapp
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        CODE_SIGN_ENTITLEMENTS: Apps/TransmuteWatch/TransmuteWatch.entitlements
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: computer.srcery.transmute
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        # Localized by Apps/TransmuteWatch/InfoPlist.xcstrings.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Transmute reads heart rate from Health during a workout.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Transmute saves your workouts to Health.
        SKIP_INSTALL: YES
    info:
      path: Apps/TransmuteWatch/Info.plist
      properties:
        WKApplication: true
        WKBackgroundModes: [workout-processing]
        UIAppFonts: [GeistMono-SemiBold.otf, GeistMono-Bold.otf]

  # Complications and the Smart Stack widgets (#15, #19).
  TransmuteWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Apps/TransmuteWatchWidgets
      - path: Apps/WidgetsShared/GlanceCopy.swift
      - path: Apps/WidgetsShared/GlanceParts.swift
      - path: Apps/Shared/Localizable.xcstrings
      - path: Apps/Shared/Assets.xcassets
      - path: Resources/Fonts/GeistMono-SemiBold.otf
        buildPhase: resources
      - path: Resources/Fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute.watchkitapp.widgets
        PRODUCT_NAME: TransmuteWatchWidgets
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        CODE_SIGN_ENTITLEMENTS: Apps/TransmuteWatchWidgets/TransmuteWatchWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
    info:
      path: Apps/TransmuteWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Transmute
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [GeistMono-SemiBold.otf]

  TransmuteMac:
    type: application
    platform: macOS
    sources:
      - Apps/TransmuteMac
      - Apps/IntentsShared
      - Apps/Shared
      - path: Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteIntelligence
      - package: TransmuteUI
      - package: TransmuteUI
        product: TransmutePlanUI
      - package: TransmuteUI
        product: TransmuteLogUI
      - package: TransmuteUI
        product: TransmuteSettingsUI
      - target: TransmuteMacWidgets
    settings:
      base:
        # The iPhone app's bundle ID, so one App Store Connect record sells and tests both
        # (universal purchase, #20).
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        CODE_SIGN_ENTITLEMENTS: $(TRANSMUTE_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
    info:
      path: Apps/TransmuteMac/Info.plist
      properties:
        ATSApplicationFontsPath: .
        # transmute://today and transmute://today/begin, from the widgets (#19).
        CFBundleURLTypes:
          - CFBundleURLName: computer.srcery.transmute
            CFBundleURLSchemes: [transmute]

  # Today on the Mac desktop and in Notification Centre (#19). Shares its views with the
  # iPhone's widgets through Apps/WidgetsShared.
  TransmuteMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - Apps/TransmuteMacWidgets
      - Apps/WidgetsShared
      - path: Apps/Shared/Localizable.xcstrings
      - path: Apps/Shared/Assets.xcassets
      - path: Resources/Fonts/GeistMono-SemiBold.otf
        buildPhase: resources
      - path: Resources/Fonts/OFL.txt
        buildPhase: resources
    dependencies:
      - package: TransmuteCore
      - package: TransmuteUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.srcery.transmute.widgets
        PRODUCT_NAME: TransmuteMacWidgets
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks
        # A widget extension has to be sandboxed, with or without a team.
        CODE_SIGN_ENTITLEMENTS: $(TRANSMUTE_MAC_WIDGETS_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
    info:
      path: Apps/TransmuteMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Transmute
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ATSApplicationFontsPath: .

schemes:
  TransmuteiOS:
    build:
      targets:
        TransmuteiOS: all
    run:
      config: Debug
  TransmuteWatch:
    build:
      targets:
        TransmuteWatch: all
  TransmuteMac:
    build:
      targets:
        TransmuteMac: all
