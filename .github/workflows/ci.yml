name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: swift-format
        run: swift format lint --strict --recursive Apps Packages

  packages:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Test packages
        run: scripts/test-packages.sh

  apps:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        scheme: [TransmuteiOS, TransmuteWatch, TransmuteMac]
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build ${{ matrix.scheme }}
        run: |
          mkdir -p build
          scripts/ci-build.sh ${{ matrix.scheme }}
